[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-cli-diagnostics"
version = "1.0.0"
description = "A deterministic command-line developer-environment diagnostics tool."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Vivek Patil"}
]
dependencies = []

[project.scripts]
rabtech-diagnostics = "diagnostics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
